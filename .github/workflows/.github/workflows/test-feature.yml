
name: Test FoundPhone Feature

on:
  push:
    branches:
      - feature-test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Verify archive
        run: |
          test -f FoundPhone-Studio-feature-increment-2.zip
          unzip -t FoundPhone-Studio-feature-increment-2.zip

      - name: Extract archive
        run: |
          mkdir -p /tmp/foundphone-build
          unzip -q FoundPhone-Studio-feature-increment-2.zip -d /tmp/foundphone-build
          PACKAGE_JSON="$(find /tmp/foundphone-build -maxdepth 5 -type f -name package.json -print -quit)"
          if [ -z "$PACKAGE_JSON" ]; then
            echo "package.json not found in ZIP"
            exit 1
          fi
          PROJECT_DIR="$(dirname "$PACKAGE_JSON")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          if [ ! -f "$PROJECT_DIR/package-lock.json" ]; then
            echo "package-lock.json not found beside package.json"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Build project
        run: npm run build
        working-directory: ${{ env.PROJECT_DIR }}
